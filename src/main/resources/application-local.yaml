server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/landing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: landing
    password: landing123
    hikari:
      connection-init-sql: "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    generate-ddl: true

  sql:
    init:
      mode: never

  # ── MailHog (docker-compose дээрх SMTP) ────────────────────────────────────
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: "http://localhost:5173"
  jwt:
    secret: "YESUNBILEG_HAMGIIN_HUURHUN_NI_SUPER_SECRET_KEY_2026"
    access-exp-minutes: 60      # Локал дээр 60 мин болгоно (refresh-тэй чирдэггүй)
    refresh-exp-days: 14
  frontend:
    reset-password-url: "http://localhost:5173/reset-password"
  payment:
    provider: MOCK
    manual-enabled: true
  plans:
    FREE:
      maxLandings: 1
      maxDomains: 0
      allowCustomDomain: false
      allowPublish: true
    PRO:
      maxLandings: 5
      maxDomains: 3
      allowCustomDomain: true
      allowPublish: true
    BUSINESS:
      maxLandings: 9999
      maxDomains: 50
      allowCustomDomain: true
      allowPublish: true

# ── Локал Admin bootstrap ────────────────────────────────────────────────────
# Spring Boot эхлэх үед автоматаар admin хэрэглэгч үүсгэнэ (хэрэв байхгүй бол).
# Нэвтрэх: admin@landing.mn / Admin1234!
LANDING_BOOTSTRAP_ADMIN_EMAIL: admin@landing.mn
LANDING_BOOTSTRAP_ADMIN_PASSWORD: Admin1234!
LANDING_BOOTSTRAP_ADMIN_FULLNAME: "Landing Admin"
LANDING_BOOTSTRAP_ADMIN_PHONE: "99119911"
LANDING_BOOTSTRAP_ADMIN_REGISTER_NUMBER: "AA00000001"
