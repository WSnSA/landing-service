services:

  # ── Backend: Spring Boot ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./back-end/landing-service
      dockerfile: Dockerfile
    container_name: landing_backend
    restart: unless-stopped
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend: React + Nginx ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./front-end/Modernminimalsaaslandingpage
      dockerfile: Dockerfile
    container_name: landing_frontend
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy
